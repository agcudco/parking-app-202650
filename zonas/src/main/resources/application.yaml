spring:
  application:
    name: mi-aplicacion

  datasource:
    url: jdbc:postgresql://localhost:5432/mi_basedatos
    username: postgres
    password: tu_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: 8080